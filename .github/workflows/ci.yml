name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: pnpm

      - name: Install dependencies
        # CC2 · 17-nov (RESPUESTA-LENOVO-a-CC2-CC7-ci-fijar-agent-runner): se instala con el lockfile CONGELADO. Antes se borraba
        # (`rm -f pnpm-lock.yaml`, 14-may, porque el lockfile hecho en Windows no traía los binarios de Linux) y cada corrida resolvía
        # de nuevo contra npm: el 17-nov rollup 4.68.5 salió como `latest` con su archivo en 404 y tumbó el CI. Hoy el lockfile ya
        # trae los binarios de Linux (`.npmrc` · supportedArchitectures linux/x64/glibc) y una versión nueva de npm no entra sola.
        # Si cambia package.json sin actualizar pnpm-lock.yaml, este paso FALLA: es a propósito (actualizar el lockfile en el mismo PR).
        run: pnpm install --frozen-lockfile

      - name: Install agent-runner dependencies
        # 🔴 (CC#1 · 01-oct · PR #418) las pruebas «de punta a punta» de mirar_afuera arrancan el servidor MCP REAL y le hablan con el cliente del SDK de MCP: ambos viven en las dependencias del
        # SERVICIO (`services/agent-runner`), no en las de la raíz. Sin este paso esas pruebas no encontraban `@modelcontextprotocol/sdk` y el CI fallaba (medido en el CI de GitHub). NO se saltan: corren.
        # CC2 · 17-nov: también con su lockfile congelado (`services/agent-runner/pnpm-lock.yaml`), por la misma razón.
        run: pnpm --dir services/agent-runner install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Lint canon (Sprint 7 Track C3 · strict post Sprint 8 D5)
        # Exit 0 · clean · Exit 1 · warnings only · Exit 2 · errors block CI
        # Sprint 8 D5 cleanup landed 2026-05-23 · baseline 60 errors → 0
        # (auth-missing fixes + lint-canon Windows path + handleStub/handleReadStub
        # /requireAdmin/buildDeprecatedResponse markers). Remaining 13 warnings
        # are deprecated-ref / naming-zr-shorthand (D6 sweep scope · NOT blocking).
        run: node scripts/lint-canon.mjs

      - name: Test
        # Sprint 8C D8 · vitest 3.2.4 downgrade resolved the rolldown
        # `@rolldown/binding-linux-x64-gnu` blocker that previously skipped
        # tests in CI. Combined with the vitest.config shebang-strip plugin
        # (handles `.mjs` script imports), the full 896/896 suite runs
        # cleanly on ubuntu-latest. Canon §4.3 "verify CI verde POST-push"
        # now includes test pass as a real gate.
        # E73 (CC#1 2026-09-17) · con el secreto N8N_API_KEY la prueba de alcanzabilidad del
        # alta compara la foto commiteada con el MOTOR (hueco 3 de E72: una foto desalineada
        # dejaba CI en verde). Sin el secreto avisa en el log y no compara. Crear el secreto
        # en GitHub → Settings → Secrets → Actions → N8N_API_KEY · manos de Emilio · nunca por chat.
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          N8N_BASE_URL: https://n8n-production-72be.up.railway.app
          EXIGIR_FFMPEG: "1"
        run: pnpm test

  # ciclo CANDADO #1 (2026-07-19) · el paquete `packages/apify-mcp-server` está
  # EXCLUIDO del tsconfig/vitest root (standalone · NodeNext · su propio toolchain).
  # Sin este job su código no lo cubre ningún gate. Lo compilamos + testeamos con su
  # propio tsc + vitest para que "CI verde" REALMENTE valide el MCP Apify. §148.
  apify-mcp-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/apify-mcp-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0

      - name: Install dependencies
        run: npm install

      - name: Build (tsc)
        run: npm run build

      - name: Test (vitest)
        run: npm test
